<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signpost</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="signpost-header">
  <div class="sp-header-left">
    <div class="sp-clockbox">
      <span class="sp-clock" id="clockText">--:--</span>
      <span class="sp-facility-badge" id="facilityName">Signpost</span>
    </div>
  </div>
  <div class="sp-header-right">
    <div class="sp-date" id="dateText">----/--/--</div>
    <div class="sp-weather-box" id="weatherBox">
      <span id="weatherIcon">--</span>
      <span id="weatherTemp">--°</span>
      <span id="weatherSub">天気を取得中…</span>
    </div>
  </div>
</header>
<div class="sp-header-divider"></div>

<main>
  <section class="weather-forecast-section">
    <div class="weather-forecast-header">
      <span class="weather-forecast-title">天気予報</span>
      <span class="weather-forecast-loc" id="weatherForecastLoc">Tokyo</span>
    </div>
    <div class="weather-forecast-card" id="weatherForecastCard">
      <!-- 動的に天気予報をここに描画 -->
    </div>
  </section>
  <div id="aiComment" class="ai-comment" hidden></div>
  <section class="calendar" id="calendarSection">
    <div class="calendar-header">
      <span id="calendarMonth"></span>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </section>
</main>

  <footer>
    <span id="updatedAt">データ読み込み中…</span>
  </footer>

<script type="module" src="assets/app.js"></script>
</body>
</html>
